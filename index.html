<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="按任务、数据版本、相机和权重交接的SafeLab协作台"><title>SafeLab · 任务交接台</title><link rel="stylesheet" href="style.css?v=task10-progress-1"><script src="model.js?v=task7-all-20261101-v1" defer></script><script src="app.js?v=task7-all-20261101-v1" defer></script></head>
<body><header class="simple-header"><div><strong>SafeLab</strong><span>训练与评测交接表</span></div><div class="actions"><span id="sync-status" role="status">正在读取…</span><button id="sync">刷新数据</button><button id="add" class="primary">＋ 新增一行</button></div></header><main id="main"><p>正在读取交接表…</p></main>

<dialog id="detail"><button class="close" aria-label="关闭详情" data-close="detail">×</button><div id="detail-body"></div></dialog>
<dialog id="editor"><button class="close" aria-label="关闭编辑" data-close="editor">×</button><h2 id="editor-title">新增训练 / 权重记录</h2><p class="muted">可先登记训练中，权重与成绩留空。修改已交付权重或数据版本会另存新行，保留旧成绩。填写后到 GitHub 确认保存。</p><form id="edit-form"><input type="hidden" name="target"><div class="form-grid"><label>任务<select name="task" required><option value="3">三子任务</option><option value="5">五子任务</option><option value="7">七子任务</option><option value="10">十子任务</option><option value="other">其他 / 待归属</option></select></label><label>训练数据版本<select name="dataset" required></select></label><label class="new-version" hidden>新版本标识（英文或数字）<input name="new_dataset" maxlength="80" placeholder="例如 3-pour-1031"></label><label class="new-version" hidden>新版本名称<input name="version" maxlength="100" placeholder="例如 1031 新采集版"></label><label class="wide">训练数据完整路径<input name="data_path" maxlength="1000" placeholder="尚未确认可先留空"></label><label>输入相机<select name="camera" required><option value="third_person">第三人称</option><option value="chest">胸部 chest</option><option value="unknown">待确认</option></select></label><label>方法 / 变体<input name="method" list="methods" maxlength="100" required placeholder="如 Mem-0、TTC、TTC · 对齐loss"></label><label>训练步数（未交付填0）<input name="step" type="number" min="0" max="1000000000" required placeholder="30000"></label><label>交接状态<select name="state"><option value="untested">已交付，待评测</option><option value="evaluating">评测中</option><option value="results">已有评测结果</option><option value="training">训练中</option><option value="blocked">阻塞</option><option value="verify">待核验</option></select></label><label class="wide">权重完整路径<input name="path" maxlength="1000" placeholder="/projects/.../executor_step30000.pt"></label><label>负责人<input name="owner" maxlength="80" placeholder="训练 / 评测负责人"></label><label>训练 run / 标识<input name="run" maxlength="150"></label><label class="wide">交付文档路径<input name="doc" maxlength="1000" placeholder=".../FINAL_DELIVERY.md"></label></div><details class="result-fields"><summary>填写评测结果（有结果时再填）</summary><div class="form-grid"><label>执行4步：成功数 / 总次数<input name="h4" placeholder="21/100" pattern="[0-9]+/[0-9]+" maxlength="16"></label><label>其中无法判定数<input name="h4unknown" type="number" min="0" max="10000000" value="0"></label><label>执行8步：成功数 / 总次数<input name="h8" placeholder="22/100" pattern="[0-9]+/[0-9]+" maxlength="16"></label><label>其中无法判定数<input name="h8unknown" type="number" min="0" max="10000000" value="0"></label><label>执行30步：成功数 / 总次数<input name="h30" placeholder="0/100" pattern="[0-9]+/[0-9]+" maxlength="16"></label><label>其中无法判定数<input name="h30unknown" type="number" min="0" max="10000000" value="0"></label><label class="wide">测试条件 / 泛化 / 环境数 / 验收依据<input name="protocol" maxlength="1000" placeholder="例如：±1cm，50左50右，单环境，自主闭环，结果文件路径"></label></div></details><label>交接备注<textarea name="note" maxlength="1000" rows="3" placeholder="训练配置、下一步、阻塞点，或视频链接"></textarea></label><p id="edit-error" class="error" role="alert"></p><div class="form-footer"><small>GitHub 登录保存；不需要填写 API 密钥。<br>公开仓库外部成员提交后，需维护者确认。</small><button type="submit" class="primary">到 GitHub 确认保存 ↗</button></div></form></dialog>
<datalist id="methods"><option value="Mem-0"><option value="TTC（ours）"><option value="pi0.5"><option value="MemoryVLA"><option value="TTC · 对齐loss"><option value="Mem-0 · 削弱版"><option value="TTC · 对齐削弱版"></datalist><div id="toast" role="status"></div>
</body></html>
