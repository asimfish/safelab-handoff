st c of d.counts){const name=c.condition==='baseline'?'原始物理':'稳定抓取附着';row('counts',[name,c.execution_horizon,c.completed+'/500 · '+c.audited+'/500',c.successes,c.final_verified?(100*c.mean_success_rate).toFixed(1)+'% ± '+(100*c.std_success_rate).toFixed(1)+'百分点':'待五轮全部验收']);for(const s of c.seeds)row('seeds',[name,c.execution_horizon,s.repeat+1,s.completed+'/100 · '+s.audited+'/100',s.successes,s.final_verified?(100*s.success_rate).toFixed(1)+'%':'待完整验收'])}}).catch(e=>document.getElementById('state').textContent='报告尚不可用：'+e.message)</script></html>
