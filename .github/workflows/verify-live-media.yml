name: Verify published media in real browser
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  media:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Verify published PR568 actual two-method synchronized player
        env:
          SAFELAB_MEDIA_QA_DIR: /tmp/safelab-live-media
        run: node tests/task3-paired-clock-live.mjs
      - name: Preserve actual browser evidence including display limitations
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: safelab-pr568-paired-clock-evidence
          path: /tmp/safelab-live-media/
          retention-days: 3
