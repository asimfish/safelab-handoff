name: Publish SafeLab Pages

on:
  push:
    branches: [docs/publish]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: safelab-pages-publication-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Check out the published tree
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Restore fixed report fixtures with wire and decoded SHA verification
        run: |
          python3 - <<'PYCODE'
          import concurrent.futures, gzip, hashlib, io, json, os, pathlib, time, urllib.error, urllib.request
          root = pathlib.Path.cwd().resolve()
          temp = pathlib.Path(os.environ['RUNNER_TEMP']) / 'safelab-fixtures'
          temp.mkdir()
          (temp / 'data.json').write_bytes((root / 'data.json').read_bytes())
          tests = {str(p): hashlib.sha256(p.read_bytes()).hexdigest() for p in sorted((root / 'tests').rglob('*')) if p.is_file() and '__pycache__' not in p.parts}
          (temp / 'test-hashes.json').write_text(json.dumps(tests))
          manifest = json.loads((root / '.github/workflows/report-fixtures-v1.json').read_text())
          objects = manifest['objects']
          assert manifest['count'] == len(objects) == 81
          assert len({o['path'] for o in objects}) == 81
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, *args, **kwargs):
                  raise RuntimeError('Redirects are forbidden for pinned fixture URLs')
          def restore(o):
              relative = pathlib.PurePosixPath(o['path'])
              assert relative.parts[0] == 'reports' and '..' not in relative.parts and not relative.is_absolute()
              target = root.joinpath(*relative.parts)
              assert target.resolve().is_relative_to(root / 'reports') and not target.is_symlink()
              assert o['url'].startswith('https://zenith-a02012413.tos-cn-beijing.volces.com/liyufeng/safelab-public/reports-v1/')
              assert 0 < o['bytes'] <= 10000000 and 0 < o['decoded_bytes'] <= 10000000
              opener = urllib.request.build_opener(NoRedirect())
              for attempt in range(3):
                  try:
                      with opener.open(o['url'], timeout=45) as response:
                          wire = response.read(o['bytes'] + 1)
                      break
                  except (urllib.error.URLError, TimeoutError, ConnectionError):
                      if attempt == 2:
                          raise
                      time.sleep(attempt + 1)
              assert len(wire) == o['bytes'] and hashlib.sha256(wire).hexdigest() == o['sha256'], o['path']
              if o['encoding'] == 'gzip':
                  with gzip.GzipFile(fileobj=io.BytesIO(wire)) as gz:
                      raw = gz.read(o['decoded_bytes'] + 1)
              else:
                  assert o['encoding'] in ('identity', 'plain', None)
                  raw = wire
              assert len(raw) == o['decoded_bytes'] and hashlib.sha256(raw).hexdigest() == o['decoded_sha256'], o['path']
              backup = temp / relative
              backup.parent.mkdir(parents=True, exist_ok=True)
              if target.exists():
                  backup.write_bytes(target.read_bytes())
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(raw)
              return o['path']
          with concurrent.futures.ThreadPoolExecutor(max_workers=6) as pool:
              verified = list(pool.map(restore, objects))
          print('Restored and SHA-verified', len(verified), 'fixed fixtures')
          PYCODE
      - name: Fill unknown historical metadata without changing results
        run: python3 scripts/fill-legacy-schema.py
      - name: Restore missing reviewed checkpoint bindings without moving identities
        run: node scripts/restore-checkpoint-bindings.cjs
      - name: Fill missing legacy metadata without changing existing evidence
        run: python3 scripts/fill-legacy-schema.py
      - name: Preserve exact source data bytes after no-op metadata checks
        run: |
          python3 - <<'PYCODE'
          import json, os, pathlib
          source = (pathlib.Path(os.environ['RUNNER_TEMP']) / 'safelab-fixtures/data.json').read_bytes()
          target = pathlib.Path('data.json')
          assert json.loads(source) == json.loads(target.read_bytes()), 'Metadata changed; publish a reviewed source update first'
          target.write_bytes(source)
          PYCODE
      - name: Check same-origin media identity and publication byte budget
        run: node scripts/check-media-budget.cjs
      - name: Verify dashboard metrics
        run: node --test tests/*.test.js
      - name: Verify lossless media migration and retained diagnostic facts
        run: |
          node --test all_task_videos/*.test.cjs long_task_videos/timeline.test.cjs
          python3 -m unittest discover -s long_task_videos -p 'test_*.py'
          python3 -m unittest discover -s tests -p 'test_frame_log_retirement.py'
      - name: Verify rendered oracle switching and checkpoint coverage
        run: |
          python3 -m http.server 8872 --bind 127.0.0.1 >/tmp/safelab-pages-qa.log 2>&1 &
          safelab_qa_server_pid=$!
          trap 'kill "$safelab_qa_server_pid"' EXIT
          export SAFELAB_QA_BASE_URL=http://127.0.0.1:8872/
          export SAFELAB_CHROME_STARTUP_MS=60000
          node tests/unknown-browser.mjs
          node tests/coverage-browser.mjs
          python3 -c "import shutil; shutil.rmtree('.qa', ignore_errors=True)"
      - name: Retire restored fixtures and verify the final publication tree
        run: |
          python3 - <<'PYCODE'
          import gzip, hashlib, json, os, pathlib
          root = pathlib.Path.cwd()
          temp = pathlib.Path(os.environ['RUNNER_TEMP']) / 'safelab-fixtures'
          objects = json.loads(pathlib.Path('.github/workflows/report-fixtures-v1.json').read_text())['objects']
          directory = json.loads(gzip.decompress(pathlib.Path('reports/directory.json.gz').read_bytes()))
          indices = {o['path']: o['proof_index'] for o in directory['objects']}
          for o in objects:
              target = pathlib.Path(o['path'])
              assert hashlib.sha256(target.read_bytes()).hexdigest() == o['decoded_sha256'], 'Fixture changed during tests: ' + o['path']
              if target.suffix == '.json':
                  target.write_text(json.dumps({'archive_id': indices[o['path']]}, separators=(',', ':')) + '\n')
              elif target.suffix == '.html':
                  target.write_text('<!doctype html><meta charset="utf-8"><meta http-equiv="refresh" content="0;url=/safelab-handoff/reports/#' + str(indices[o['path']]) + '"><a href="/safelab-handoff/reports/#' + str(indices[o['path']]) + '">Archived report</a>\n')
              else:
                  backup = temp / o['path']
                  if backup.exists():
                      target.write_bytes(backup.read_bytes())
                  else:
                      target.unlink()
          assert pathlib.Path('data.json').read_bytes() == (temp / 'data.json').read_bytes(), 'data.json bytes changed'
          expected = json.loads((temp / 'test-hashes.json').read_text())
          actual = {str(p): hashlib.sha256(p.read_bytes()).hexdigest() for p in sorted((root.resolve() / 'tests').rglob('*')) if p.is_file() and '__pycache__' not in p.parts}
          assert actual == expected, 'tests/ changed'
          # Build-only sources remain in Git; publish only the static website.
          import shutil
          site = pathlib.Path(os.environ['RUNNER_TEMP']) / 'safelab-static-site'
          # The repository README stays available on GitHub; no site links target it.
          excluded = {'.git', '.github', 'tests', 'scripts', 'README.md'}
          site.mkdir()
          for entry in root.iterdir():
              if entry.name in excluded:
                  continue
              target = site / entry.name
              if entry.is_dir():
                  ignored = ['__pycache__', '*.pyc', '*.test.cjs', '*.test.js', 'test_*.py']
                  if entry.name == 'long_task_videos':
                      # Offline-only analysis helpers remain in Git and are tested above.
                      # Linked audit sources and paper reproduction scripts stay published.
                      ignored += ['task10-classifier.py', 'task5-classifier.py', 'oracle-v13-reference.py', 'release-segment-review.py']
                  shutil.copytree(entry, target, ignore=shutil.ignore_patterns(*ignored))
              else:
                  shutil.copy2(entry, target)
          # Preserve Git/test bytes; serve the old download as lossless gzip plus a pointer.
          archive = json.loads(pathlib.Path('long_task_videos/classification-audit-gzip.json').read_text())
          source = pathlib.Path(archive['path']).read_bytes()
          wire = (site / 'long_task_videos' / archive['url']).read_bytes()
          assert len(wire) == archive['bytes'] and hashlib.sha256(wire).hexdigest() == archive['sha256']
          assert gzip.decompress(wire) == source
          assert len(source) == archive['decoded_bytes'] and hashlib.sha256(source).hexdigest() == archive['decoded_sha256']
          (site / archive['path']).write_text(json.dumps(archive, separators=(',', ':')) + '\n')
          assert (site / 'data.json').read_bytes() == pathlib.Path('data.json').read_bytes()
          files = [p for p in site.rglob('*') if p.is_file()]
          size = sum(p.stat().st_size for p in files)
          assert size <= 32000000, f'Publication tree exceeds 32MB: {size}'
          print('Final publication bytes:', size)
          print('data.json SHA256:', hashlib.sha256(pathlib.Path('data.json').read_bytes()).hexdigest())
          PYCODE
      - name: Upload the static website
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: ${{ runner.temp }}/safelab-static-site
          retention-days: 1
  deploy:
    if: github.ref == 'refs/heads/docs/publish'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the verified snapshot
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
