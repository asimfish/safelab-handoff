<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>七任务 · 稳定抓起后固定关节</title><style>body{font:16px/1.6 system-ui;max-width:1250px;margin:40px auto;padding:0 24px;background:#f4f6fa;color:#182435}h1{font-size:28px}a{color:#235ac3}.card{background:white;border:1px solid #d8dfeb;padding:20px;margin:18px 0;border-radius:12px}.scroll{overflow:auto}table{width:100%;border-collapse:collapse;white-space:nowrap}th,td{text-align:left;padding:9px;border-bottom:1px solid #e1e7ef}th{color:#526077}small{color:#526077}button{padding:7px 14px;cursor:pointer}pre{white-space:pre-wrap}#error{color:#a33}</style><a href="../#task7">← 返回七任务面板</a><h1>稳定抓起后固定关节</h1><p>独立辅助物理条件。成绩与原 baseline 分开统计。</p><div class="card"><p id="status">正在读取…</p><button id="reload">刷新</button><small id="updated"></small><p id="resource"></p></div><div class="card"><b>抓取与释放</b><p id="protocol"></p><p>从最近一次稳定支撑高度抬升至少1.5cm；拇指和另一手指真实接触，相对位姿连续稳定0.2秒后，建立原生固定关节。冻结抓住时的手指姿态，仅过滤这只手与该烧杯的碰撞，保留烧杯与环境的碰撞及动态属性。张手时解除；连接状态不能通过放置验收。</p><b>不计分的真实仿真验证</b><pre id="canary">等待验证记录</pre></div><div class="card scroll"><table><thead><tr><th>配置</th><th>权重</th><th>执行步数</th><th>已验收</th><th>成功数</th><th>最终成功率</th><th>发生连接的轨迹</th><th>连接／张手释放</th></tr></thead><tbody id="rows"></tbody></table></div><p id="error"></p><script>async function load(){try{const res=await fetch('task7-all-20261101.json?t='+Date.now(),{cache:'no-store'});if(!res.ok)throw Error('HTTP '+res.status);const d=(await res.json()).assisted;if(!d)throw Error('辅助评测记录尚未同步');document.querySelector('#status').textContent=d.title+' · '+d.completed+'/'+d.target+' 已验收 · '+d.status_label;document.querySelector('#updated').textContent=' 更新：'+d.updated_at;document.querySelector('#resource').textContent=d.resource_note+' 当前'+d.active_apps+'路，最多'+d.max_parallel_apps+'路独立N1。';document.querySelector('#protocol').textContent=d.protocol;const n=d.native_canary;document.querySelector('#canary').textContent=n&&n.passed?'通过：'+n.physics_ticks+'次原生物理记录；'+n.activations+'次真实连接、'+n.policy_releases+'次张手释放；最大相对位置误差 '+(n.maximum_constraint_translation_error_m*1000).toFixed(3)+'mm。已验证从垫子和较高的秤盘重新抓起。该回放没有调用模型，不代表模型成功率。':'原生验证中；正式统计尚未释放。';const tbody=document.querySelector('#rows');tbody.replaceChildren();for(const c of d.counts){const tr=document.createElement('tr');for(const value of [c.method,c.checkpoint_step/1000+'k',c.execution_horizon,c.completed+'/100',c.successes,c.final_verified?(c.final_success_rate*100).toFixed(0)+'%':'待满100条验收',c.trials_attached,c.attachment_activations+' / '+c.policy_releases]){const td=document.createElement('td');td.textContent=value;tr.append(td)}tbody.append(tr)}document.querySelector('#error').textContent=''}catch(e){document.querySelector('#error').textContent='读取失败：'+e.message}}document.querySelector('#reload').onclick=load;load();setInterval(load,60000)</script></html>
